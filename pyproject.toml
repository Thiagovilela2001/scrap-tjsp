[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scraping-tjsp"
version = "0.2.0"
description = "Coletor responsável de jurisprudência pública do TJSP (CJSG)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "chromadb>=1.5,<2",
  "fastapi>=0.139,<1",
  "openai>=2,<3",
  "pymupdf>=1.26,<2",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
  "uvicorn>=0.51,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2.9,<3", "pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
tjsp-jurisprudencia = "scraping_tjsp.cli:main"
tjsp-busca = "scraping_tjsp.search_cli:main"
tjsp-avaliar = "scraping_tjsp.evaluation_cli:main"
tjsp-auditoria = "scraping_tjsp.audit_cli:main"
tjsp-preparar-dataset = "scraping_tjsp.dataset_cli:main"
tjsp-api = "scraping_tjsp.api_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scraping_tjsp = ["schema_sqlite.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF", "UP"]
